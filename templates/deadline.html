{% extends "base.html" %}
{% block content %}
<p>The deadline for <b>{{ title }}</b> is <b>{{ due_label }}, {{ due_time }}</b>.</p>
<p style="font-size:28px;font-weight:700;color:{{ accent }};margin:10px 0;">
{% if days_left == 0 %}Due today!{% else %}{{ days_left }} day{{ 's' if days_left != 1 }} left{% endif %}</p>
<p>Make sure everything is submitted before the deadline.</p>
{% endblock %}
